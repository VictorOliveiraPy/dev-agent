name: CI

# Roda lint + testes a cada push/PR pra main. Nenhum secret é necessário:
# a suíte inteira de testes usa chat models falsos (sem rede), então não
# depende de ANTHROPIC_API_KEY — ver tests/test_usage.py e tests/test_team.py.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest)
        run: python -m pytest -q
