[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["workspace"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "SIM"]
# S101: assert em teste é o padrão do pytest, não um risco.
# S602/S603/S607: subprocess com shell=True é intencional nas tools do
# time (rodar comandos dentro da sandbox) — ver docstrings de tools.py e
# project_tools.py.
ignore = ["S101", "S602", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
